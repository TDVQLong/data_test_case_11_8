specVersion: vsf-idp.io/v2

metadata:
  domain: eshop
  system: eshopai
  namespace: eshop

spec:
  type: service
  id: bot-api
  name: Bot API
  description: Bot API component for eShopOnContainersAI
  owners:
    members:
      - user: admin@eshop.com
        role: techlead
  review:
    branch: "main"
  topology:
    - ref: system:eshop/eshopai
      reason: This component is part of the eshopai system
    - ref: component:eshop/webshoppingapigw
      reason: Depends on webshoppingapigw
    - ref: component:eshop/webaiapigw
      reason: Depends on webaiapigw
