specVersion: vsf-idp.io/v2

metadata:
  domain: eshop
  system: eshopai
  namespace: eshop

spec:
  type: service
  id: marketing-api
  name: Marketing API
  description: Marketing API component for eShopOnContainersAI
  owners:
    members:
      - user: admin@eshop.com
        role: techlead
  review:
    branch: "main"
  topology:
    - ref: system:eshop/eshopai
      reason: This component is part of the eshopai system
    - ref: component:eshop/sql-data
      reason: Depends on sql-data
    - ref: component:eshop/nosql-data
      reason: Depends on nosql-data
    - ref: component:eshop/identity-api
      reason: Depends on identity-api
    - ref: component:eshop/rabbitmq
      reason: Depends on rabbitmq
